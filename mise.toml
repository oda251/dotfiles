[hooks.enter]
shell = "bash"
script = '''
if [ ! -f "${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}" ]; then
  echo -e "\033[33m⚠ SOPS age key not found. Run 'age-keygen -o ~/.config/sops/age/keys.txt' or restore from backup.\033[0m"
fi
'''

[tasks.setup-uv-tools]
alias = ["setup:uv", "uv-tools"]
description = "Install tools via uv tool (atcoder-tools, semble)"
run = [
  "uv tool install atcoder-tools --force",
  'uv tool install "semble[mcp] @ git+https://github.com/MinishLab/semble" --force',
]

