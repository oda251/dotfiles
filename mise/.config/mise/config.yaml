[tools]
"github:BurntSushi/ripgrep" = "latest"
"aqua:eza-community/eza" = "latest"
"github:sxyazi/yazi" = "latest"
"aqua:sharkdp/bat" = "latest"
fzf = "latest"
neovim = "latest"
uv = "latest"
stow = "latest"
bun = "latest"
rust = "stable"
terraform = "latest"

[tasks.setup_atcoder]
description = "AtCoder 向けセットアップ（Python + uv + atcoder-tools と GCC/AtCoder Library）"
run = [
  "uv pip install --upgrade pip",
  "uv pip install atcoder-tools",
  "bash /Users/oda_yuya/dotfiles/scripts/setup-competitive.sh",
]

[tasks.gh_dash]
description = "gh-dash の gh 拡張をインストール (dlvhdr/gh-dash)"
run = [
  "if ! command -v gh >/dev/null 2>&1; then echo 'gh CLI が見つかりません。先に gh をインストールしてください。' && exit 1; fi",
  "if gh extension list | grep -q 'gh-dash'; then echo 'gh-dash は既にインストールされています'; else gh extension install dlvhdr/gh-dash; fi",
]

[tasks.setup]
description = "全セットアップをまとめて実行: setup_atcoder → gh_dash"
run = [
  "uv pip install --upgrade pip",
  "uv pip install atcoder-tools",
  "bash /Users/oda_yuya/dotfiles/scripts/setup-competitive.sh",
  "if ! command -v gh >/dev/null 2>&1; then echo 'gh CLI が見つかりません。先に gh をインストールしてください。' && exit 1; fi",
  "if gh extension list | grep -q 'gh-dash'; then echo 'gh-dash は既にインストールされています'; else gh extension install dlvhdr/gh-dash; fi",
]
