name: Pulumi

on:
  pull_request:
    paths: [pulumi/**]
  push:
    branches: [main]
    paths: [pulumi/**]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pulumi-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/bun.lock') }}
          restore-keys: pulumi-plugins-${{ runner.os }}-

      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: oda251/dotfiles/prod
          comment-on-pr: true
          work-dir: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  up:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/bun.lock') }}
          restore-keys: pulumi-plugins-${{ runner.os }}-

      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: oda251/dotfiles/prod
          work-dir: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
