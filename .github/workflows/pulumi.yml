name: Pulumi

on:
  pull_request:
    paths:
      - pulumi/**
      - .github/workflows/pulumi.yml
  push:
    branches: [main]
    paths:
      - pulumi/**
      - .github/workflows/pulumi.yml

permissions:
  id-token: write       # required for GitHub OIDC token issuance
  contents: read
  pull-requests: write

concurrency:
  group: pulumi-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # oxlint --type-check --type-aware。型情報を使うので install 後に実行する
      - run: bun run lint

  preview:
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/bun.lock') }}
          restore-keys: pulumi-plugins-${{ runner.os }}-

      - uses: pulumi/auth-actions@v2
        with:
          organization: oda251
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:oda251

      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: oda251/dotfiles/prod
          comment-on-pr: true
          work-dir: pulumi

  up:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/bun.lock') }}
          restore-keys: pulumi-plugins-${{ runner.os }}-

      - uses: pulumi/auth-actions@v2
        with:
          organization: oda251
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:oda251

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: oda251/dotfiles/prod
          work-dir: pulumi
