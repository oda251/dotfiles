name: Terraform PR Comment
description: Post or update a Terraform plan/apply result as a PR comment

inputs:
  pr_number:
    description: "Pull request number"
    required: true
  stack:
    description: "Stack directory name"
    required: true
  command:
    description: "Command that was run (plan or apply)"
    required: true
  output:
    description: "Terraform output"
    required: true
  has_changes:
    description: "Whether there are changes"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Post comment
      uses: actions/github-script@v7
      with:
        script: |
          const stack = '${{ inputs.stack }}';
          const command = '${{ inputs.command }}';
          const hasChanges = '${{ inputs.has_changes }}' === 'true';
          const output = `${{ inputs.output }}`.slice(0, 60000); // GitHub comment limit
          const marker = `<!-- terraform:${stack}:${command} -->`;

          let status;
          if (command === 'plan') {
            status = hasChanges ? '⚠️ Changes detected' : '✅ No changes';
          } else {
            status = '🚀 Applied';
          }

          const body = [
            marker,
            `### Terraform ${command}: \`${stack}\``,
            '',
            status,
            '',
            '<details>',
            `<summary>Output</summary>`,
            '',
            '```',
            output,
            '```',
            '',
            '</details>',
          ].join('\n');

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number('${{ inputs.pr_number }}'),
          });
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
          }
