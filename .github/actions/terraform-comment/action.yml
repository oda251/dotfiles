name: Terraform PR Comment
description: Post or update a Terraform plan/apply result as a PR comment

inputs:
  pr_number:
    description: "Pull request number"
    required: true
  stack:
    description: "Stack directory name"
    required: true
  workspace:
    description: "Terraform workspace name"
    required: false
    default: ""
  command:
    description: "Command that was run (plan or apply)"
    required: true
  output_path:
    description: "Path to output file"
    required: true
  has_changes:
    description: "Whether there are changes"
    required: false
    default: "true"
  format:
    description: "Output format: diff or text"
    required: false
    default: "diff"
  plan_hash:
    description: "Hash of plan output for dedup"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const stack = '${{ inputs.stack }}';
          const workspace = '${{ inputs.workspace }}' || stack.split('/').pop();
          const command = '${{ inputs.command }}';
          const hasChanges = '${{ inputs.has_changes }}' === 'true';
          const format = '${{ inputs.format }}';
          const planHash = '${{ inputs.plan_hash }}';
          const MAX_BODY = 65000;

          // Metadata marker for identifying and updating comments
          const meta = { workspace, plan_hash: planHash, format };
          const marker = `<!-- terraform:${stack}:${command} ${JSON.stringify(meta)} -->`;
          const markerPrefix = `<!-- terraform:${stack}:${command} `;

          // Check if existing comment has same plan_hash -> skip update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number('${{ inputs.pr_number }}'),
          });
          const existing = comments.find(c => c.body.startsWith(markerPrefix));

          if (existing && planHash) {
            try {
              const existingMeta = JSON.parse(
                existing.body.split('-->')[0].replace(markerPrefix, '')
              );
              if (existingMeta.plan_hash === planHash) {
                core.info('Plan unchanged, skipping comment update');
                return;
              }
            } catch {}
          }

          let status;
          if (command === 'plan') {
            status = hasChanges ? '⚠️ Changes detected' : '✅ No changes';
          } else {
            status = '🚀 Applied';
          }

          // Determine code block format
          const codeFormat = format === 'diff' ? 'diff' : '';

          // Build skeleton to measure reserved space
          const skeleton = [
            marker,
            `### Terraform ${command}: \`${workspace}\``,
            '', status, '',
            '<details>', '<summary>Output</summary>', '',
            '```' + codeFormat, '', '```', '',
            '</details>',
          ].join('\n');
          const reservedSize = Buffer.byteLength(skeleton, 'utf8');
          const maxOutput = MAX_BODY - reservedSize;

          // Format plan output for diff syntax highlighting
          // Move +/-/~ from indented position to line start so GitHub colors them
          function formatDiff(text) {
            if (format !== 'diff') return text;
            return text.split('\n').map(line => {
              // Blank lines
              if (line.trim() === '') return '';
              // Comment lines like "# aws_instance.example will be created"
              if (line.match(/^\s*#/)) return line;
              // Summary lines like "Plan: 1 to add..."
              if (line.match(/^Plan:|^No changes|^Changes to Outputs/)) return line;
              // Match lines like "  + resource" or "      + ami = ..."
              const m = line.match(/^(\s*)([\+\-~])\s(.*)$/);
              if (m) {
                const [, indent, symbol, rest] = m;
                const prefix = symbol === '~' ? '!' : symbol;
                return `${prefix} ${indent}${rest}`;
              }
              return `  ${line}`;
            }).join('\n');
          }

          // Read, filter noise, and format
          const raw = fs.readFileSync('${{ inputs.output_path }}', 'utf8');
          const filtered = raw.split('\n').filter(line =>
            !line.match(/^.*Refreshing state\.\.\./) &&
            !line.match(/^.*Reading\.\.\./) &&
            !line.match(/^.*Read complete after/)
          ).join('\n');
          const formatted = formatDiff(filtered);
          const lines = formatted.split('\n');
          const truncMsg = 'Plan is too large to fit in a PR comment. See the full plan in the workflow log.';
          let outputLines = [];
          let totalSize = 0;
          let truncated = false;

          for (const line of lines) {
            const lineSize = Buffer.byteLength(line, 'utf8') + 1;
            if (totalSize + lineSize > maxOutput) {
              outputLines.push(truncMsg);
              truncated = true;
              break;
            }
            outputLines.push(line);
            totalSize += lineSize;
          }

          // Track truncation in format
          const actualFormat = truncated ? format + '-trunc' : format;
          const actualMeta = { workspace, plan_hash: planHash, format: actualFormat };
          const actualMarker = `<!-- terraform:${stack}:${command} ${JSON.stringify(actualMeta)} -->`;

          const body = [
            actualMarker,
            `### Terraform ${command}: \`${workspace}\``,
            '',
            status,
            '',
            '<details>',
            '<summary>Output</summary>',
            '',
            '```' + codeFormat,
            outputLines.join('\n'),
            '```',
            '',
            '</details>',
          ].join('\n');

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
          }
