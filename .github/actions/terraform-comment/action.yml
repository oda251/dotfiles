name: Terraform PR Comment
description: Post or update a Terraform plan/apply result as a PR comment

inputs:
  pr_number:
    description: "Pull request number"
    required: true
  stack:
    description: "Stack directory name"
    required: true
  command:
    description: "Command that was run (plan or apply)"
    required: true
  output:
    description: "Terraform output"
    required: true
  has_changes:
    description: "Whether there are changes"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Post comment
      uses: actions/github-script@v7
      env:
        TF_OUTPUT: ${{ inputs.output }}
      with:
        script: |
          const stack = '${{ inputs.stack }}';
          const command = '${{ inputs.command }}';
          const hasChanges = '${{ inputs.has_changes }}' === 'true';
          const marker = `<!-- terraform:${stack}:${command} -->`;

          const MAX_BODY = 65536;
          const RESERVED = 500; // header, status, details tags
          const maxOutput = MAX_BODY - RESERVED;

          let output = process.env.TF_OUTPUT || '';
          let truncated = false;
          if (output.length > maxOutput) {
            output = output.slice(0, maxOutput);
            truncated = true;
          }

          let status;
          if (command === 'plan') {
            status = hasChanges ? '⚠️ Changes detected' : '✅ No changes';
          } else {
            status = '🚀 Applied';
          }

          const parts = [
            marker,
            `### Terraform ${command}: \`${stack}\``,
            '',
            status,
            '',
            '<details>',
            `<summary>Output</summary>`,
            '',
            '```diff',
            output,
            '```',
            '',
            '</details>',
          ];

          if (truncated) {
            parts.push('', '> ⚠️ Output truncated. See workflow logs for full output.');
          }

          const body = parts.join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number('${{ inputs.pr_number }}'),
          });
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
          }
