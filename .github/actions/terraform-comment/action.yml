name: Terraform PR Comment
description: Post or update a Terraform plan/apply result as a PR comment

inputs:
  pr_number:
    description: "Pull request number"
    required: true
  stack:
    description: "Stack directory name"
    required: true
  command:
    description: "Command that was run (plan or apply)"
    required: true
  output_path:
    description: "Path to output file"
    required: true
  has_changes:
    description: "Whether there are changes"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Post comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const stack = '${{ inputs.stack }}';
          const command = '${{ inputs.command }}';
          const hasChanges = '${{ inputs.has_changes }}' === 'true';
          const marker = `<!-- terraform:${stack}:${command} -->`;
          const MAX_BODY = 50000;

          let status;
          if (command === 'plan') {
            status = hasChanges ? '⚠️ Changes detected' : '✅ No changes';
          } else {
            status = '🚀 Applied';
          }

          // Build comment skeleton without output to measure reserved space
          const skeleton = [
            marker,
            `### Terraform ${command}: \`${stack}\``,
            '',
            status,
            '',
            '<details>',
            '<summary>Output</summary>',
            '',
            '```diff',
            '',  // placeholder for output
            '```',
            '',
            '</details>',
          ].join('\n');
          const reservedSize = Buffer.byteLength(skeleton, 'utf8');
          const maxOutput = MAX_BODY - reservedSize;

          // Read and truncate line-by-line
          const raw = fs.readFileSync('${{ inputs.output_path }}', 'utf8');
          const lines = raw.split('\n');
          const truncMsg = 'Plan is too large to fit in a PR comment. See the full plan in the workflow log.';
          let outputLines = [];
          let totalSize = 0;
          let truncated = false;

          for (const line of lines) {
            const lineSize = Buffer.byteLength(line, 'utf8') + 1;
            if (totalSize + lineSize > maxOutput) {
              outputLines.push(truncMsg);
              truncated = true;
              break;
            }
            outputLines.push(line);
            totalSize += lineSize;
          }

          const output = outputLines.join('\n');

          const body = [
            marker,
            `### Terraform ${command}: \`${stack}\``,
            '',
            status,
            '',
            '<details>',
            '<summary>Output</summary>',
            '',
            '```diff',
            output,
            '```',
            '',
            '</details>',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number('${{ inputs.pr_number }}'),
          });
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
          }
