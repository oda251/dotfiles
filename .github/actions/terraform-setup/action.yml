name: Terraform Setup
description: Install Terraform/Terragrunt, set all TFC workspaces to local execution, and init all stacks

inputs:
  working_directory:
    description: "Terraform root directory (containing root.hcl and stack subdirs)"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup Terragrunt
      uses: autero1/action-terragrunt@v3
      with:
        terragrunt-version: latest

    - name: Set all workspaces to local execution
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        for dir in */; do
          [ -f "${dir}terragrunt.hcl" ] || continue
          WS=$(basename "$dir")
          curl -sf \
            --header "Authorization: Bearer $TF_TOKEN_app_terraform_io" \
            --header "Content-Type: application/vnd.api+json" \
            --request PATCH \
            "https://app.terraform.io/api/v2/organizations/$TF_CLOUD_ORGANIZATION/workspaces/$WS" \
            --data '{"data":{"type":"workspaces","attributes":{"execution-mode":"local"}}}' >/dev/null
        done
      env:
        TF_TOKEN_app_terraform_io: ${{ env.TF_API_TOKEN }}
        TF_CLOUD_ORGANIZATION: ${{ env.TF_CLOUD_ORGANIZATION }}

    - name: Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terragrunt run --all --non-interactive init -- -input=false -no-color
      env:
        TF_TOKEN_app_terraform_io: ${{ env.TF_API_TOKEN }}
        TF_CLOUD_ORGANIZATION: ${{ env.TF_CLOUD_ORGANIZATION }}
