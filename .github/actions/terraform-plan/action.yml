name: Terraform Plan
description: Run terragrunt plan and capture output

inputs:
  working_directory:
    description: "Terraform working directory"
    required: true
  tf_api_token:
    description: "Terraform Cloud API token"
    required: true
  tf_cloud_organization:
    description: "Terraform Cloud organization"
    required: true

outputs:
  plan_output:
    description: "Terraform plan output"
    value: ${{ steps.plan.outputs.plan_output }}
  has_changes:
    description: "Whether plan has changes"
    value: ${{ steps.plan.outputs.has_changes }}

runs:
  using: composite
  steps:
    - name: Setup
      uses: oda251/dotfiles/.github/actions/terraform-setup@main
      with:
        working_directory: ${{ inputs.working_directory }}
        tf_api_token: ${{ inputs.tf_api_token }}
        tf_cloud_organization: ${{ inputs.tf_cloud_organization }}

    - name: Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set +e
        OUTPUT=$(terragrunt plan -no-color -detailed-exitcode 2>&1)
        EXIT_CODE=$?
        set -e

        # Exit code 0 = no changes, 1 = error, 2 = has changes
        if [ $EXIT_CODE -eq 1 ]; then
          echo "$OUTPUT"
          exit 1
        fi

        # GITHUB_OUTPUT has 1MB limit; truncate if needed
        if [ ${#OUTPUT} -gt 900000 ]; then
          OUTPUT="${OUTPUT:0:900000}
... (truncated, see workflow logs)"
        fi

        EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "plan_output<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"

        if [ $EXIT_CODE -eq 2 ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.tf_api_token }}
        TF_CLOUD_ORGANIZATION: ${{ inputs.tf_cloud_organization }}
