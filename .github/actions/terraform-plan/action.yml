name: Terraform Plan
description: Run terragrunt plan and capture output

inputs:
  working_directory:
    description: "Terraform working directory"
    required: true

outputs:
  plan_text_path:
    description: "Path to plan output file"
    value: ${{ steps.plan.outputs.plan_text_path }}
  has_changes:
    description: "Whether plan has changes"
    value: ${{ steps.plan.outputs.has_changes }}
  format:
    description: "Output format: diff, text (error)"
    value: ${{ steps.plan.outputs.format }}
  plan_hash:
    description: "Hash of plan output (excluding warnings)"
    value: ${{ steps.plan.outputs.plan_hash }}

runs:
  using: composite
  steps:
    - name: Setup
      uses: oda251/dotfiles/.github/actions/terraform-setup@main
      with:
        working_directory: ${{ inputs.working_directory }}

    - name: Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -o pipefail
        PLAN_FILE="$(mktemp)"

        EXIT_CODE=0
        terragrunt plan --terragrunt-no-auto-init -no-color -detailed-exitcode 2>&1 | tee "$PLAN_FILE" || EXIT_CODE=$?

        echo "plan_text_path=$PLAN_FILE" >> "$GITHUB_OUTPUT"

        # Exit code 0 = no changes, 1 = error, 2 = has changes
        if [ $EXIT_CODE -eq 1 ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "format=text" >> "$GITHUB_OUTPUT"
          echo "plan_hash=" >> "$GITHUB_OUTPUT"
          exit 1
        elif [ $EXIT_CODE -eq 2 ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "format=diff" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "format=diff" >> "$GITHUB_OUTPUT"
        fi

        # Hash plan excluding warnings (for change detection)
        HASH=$(grep -v '^\s*Warning:' "$PLAN_FILE" | grep -v '^\s*│' | sha256sum | cut -d' ' -f1)
        echo "plan_hash=$HASH" >> "$GITHUB_OUTPUT"
      env:
        TF_TOKEN_app_terraform_io: ${{ env.TF_API_TOKEN }}
        TF_CLOUD_ORGANIZATION: ${{ env.TF_CLOUD_ORG }}
