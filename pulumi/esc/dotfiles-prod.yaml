# Pulumi ESC environment: oda251/dotfiles/prod
# Apply: esc env edit oda251/dotfiles/prod -f this-file
# Then re-inject secrets: esc env set ... --secret --string

values:
  secrets:
    githubToken:
      fn::secret: PLACEHOLDER_GITHUB_PAT
    newrelicApiKey:
      fn::secret: PLACEHOLDER_NEWRELIC_API_KEY
    memoBotDiscordToken:
      fn::secret: PLACEHOLDER_DISCORD_BOT_TOKEN
    memoBotGithubPat:
      fn::secret: PLACEHOLDER_GITHUB_PAT_VAULT_WRITE
    memoBotAllowedUserId:
      fn::secret: PLACEHOLDER_DISCORD_USER_ID

  newrelic:
    accountId: "7893158"
    region: US

  gcp:
    projectId: dotfiles-oda251
    userEmail: PLACEHOLDER_USER_EMAIL

  memoBot:
    gasScriptId: PLACEHOLDER_GAS_SCRIPT_ID

  stackRefs:
    fn::open::pulumi-stacks:
      stacks:
        dotfilesProd:
          stack: dotfiles/prod

  repos:
    all:
      - name: template
        description: Template repository with CI boilerplate
        isTemplate: true
      - name: dotfiles
        description: chezmoi dotfiles
        topics: [dotfiles, chezmoi]
        template: template
        hasESC: true
      - name: garden
        template: template
        hasESC: true
      - name: onegai
        template: template
        hasESC: true
      - name: career
        visibility: private
      - name: obsidian-vault
        visibility: private
        vulnerabilityAlerts: false

  pulumiConfig:
    github:owner: oda251
    github:token: ${secrets.githubToken}
    newrelic:apiKey: ${secrets.newrelicApiKey}
    newrelic:accountId: ${newrelic.accountId}
    newrelic:region: ${newrelic.region}
    repos:all: ${repos.all}
    gcp:projectId: ${gcp.projectId}
    gcp:userEmail: ${gcp.userEmail}
    memoBot:discordBotToken: ${secrets.memoBotDiscordToken}
    memoBot:githubPat: ${secrets.memoBotGithubPat}
    memoBot:allowedDiscordUserId: ${secrets.memoBotAllowedUserId}

  environmentVariables:
    GITHUB_TOKEN: ${secrets.githubToken}
    NEW_RELIC_API_KEY: ${secrets.newrelicApiKey}
    NEW_RELIC_ACCOUNT_ID: ${newrelic.accountId}
    NEW_RELIC_REGION: ${newrelic.region}
    NEWRELIC_LICENSE_KEY: ${stackRefs.dotfilesProd.newrelicLicenseKey}
    NEWRELIC_OTLP_ENDPOINT: ${stackRefs.dotfilesProd.otlpEndpoint}
    GOOGLE_PROJECT: ${gcp.projectId}
    GCP_PROJECT_ID: ${gcp.projectId}
    MEMO_BOT_GAS_SCRIPT_ID: ${memoBot.gasScriptId}
