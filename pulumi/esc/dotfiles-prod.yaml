# Pulumi ESC environment: oda251/dotfiles/prod
# Apply: pulumi env edit oda251/dotfiles/prod -f this-file
# Then re-inject secrets: pulumi env set ... --secret --string

values:
  secrets:
    githubToken:
      fn::secret: PLACEHOLDER_GITHUB_PAT

  repos:
    all:
      - name: template
        description: Template repository with CI boilerplate
        isTemplate: true
      - name: dotfiles
        description: chezmoi dotfiles
        topics: [dotfiles, chezmoi]
        template: template
        hasESC: true
      - name: garden
        template: template
        hasESC: true
      - name: onegai
        template: template
        hasESC: true
      - name: career
        visibility: private
      - name: obsidian-vault
        visibility: private
        vulnerabilityAlerts: false
      - name: reactive-sound
        template: template

  pulumiConfig:
    github:owner: oda251
    github:token: ${secrets.githubToken}
    repos:all: ${repos.all}

  environmentVariables:
    GITHUB_TOKEN: ${secrets.githubToken}
