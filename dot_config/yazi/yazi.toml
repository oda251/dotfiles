[mgr]
ratio = [ 0, 1, 2 ]

[opener]
# エディタ（Neovim）: block = true でターミナルを占有
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim" }
]
# 画像ビューア: MacOSなら 'open'、Linuxなら 'xdg-open' や 'imv' など
image = [
	{ run = 'open "$@"', desc = "Open Image" }
]
# SOPS 暗号化ファイル: 復号してエディタで開き、保存時に再暗号化
sops = [
	{ run = 'sops "$@"', block = true, desc = "SOPS Edit" }
]
# ブラウザ（HTMLなど）
web = [
	{ run = 'open "$@"', desc = "Open in Browser" }
]

[open]
prepend_rules = [
	# SOPS
	{ url = "*.enc.yaml", use = [ "sops", "edit" ] },
	{ url = "*.enc.json", use = [ "sops", "edit" ] },

	# HTML
	{ url = "*.html", use = [ "web", "edit" ] },
	{ mime = "text/html", use = [ "web", "edit" ] },

	# Markdown（macOS のデフォルトアプリに奪われないよう nvim へ明示）
	{ url = "*.md", use = "edit" },
	{ url = "*.markdown", use = "edit" },

	# 画像
	{ mime = "image/*", use = [ "image", "edit" ] },

	# 空ファイル
	{ mime = "inode/empty", use = "edit" },
]

[flavor]
dark = "catppuccin-mocha"

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
