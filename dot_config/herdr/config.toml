# Match Ghostty's theme (dot_config/ghostty/config: theme = TokyoNight).
[theme]
name = "tokyo-night"

[keys]
# Every action keeps its default prefix binding and gains a direct chord on top.
# ctrl+alt is the modifier family Herdr's own docs recommend for prefix-free use:
# untouched by macOS's alt-composing behavior and not claimed by Ghostty
# defaults, unlike bare alt (https://herdr.dev/docs/keyboard/).
new_tab          = ["prefix+c", "ctrl+alt+c", "super+t", "ctrl+t"]
# close_pane closes the tab too when it's the last pane in the tab.
close_pane       = ["prefix+x", "super+w", "ctrl+w", "alt+w"]
previous_tab     = ["prefix+p", "ctrl+alt+["]
next_tab         = ["prefix+n", "ctrl+alt+]"]
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
split_vertical   = ["prefix+v", "ctrl+alt+d", "alt+t"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
zoom             = ["prefix+z", "ctrl+alt+z"]
