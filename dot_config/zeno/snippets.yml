snippets:
  - name: eza
    keyword: ls
    snippet: eza --icons

  - name: df human-readable
    keyword: df
    snippet: df -h

  - name: nvim
    keyword: v
    snippet: nvim

  - name: lazygit
    keyword: lg
    snippet: lazygit

  - name: timestamp
    keyword: now
    snippet: "date '+%Y%m%d%H%M%S'"

  - name: copilot
    keyword: copilot
    snippet: copilot --allow-all-tools

  - name: claude
    keyword: claude
    snippet: claude --dangerously-skip-permissions

  - name: codex
    keyword: codex
    snippet: codex --ask-for-approval never --sandbox danger-full-access
